<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>导向标识生成器 — 浏览器测试套件</title>
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; max-width: 980px; margin: 2em auto; padding: 0 1em; background: #f5f5f6; color: #333; }
    h1 { border-bottom: 2px solid #2563eb; padding-bottom: 0.3em; font-size: 1.3em; }
    .summary { font-size: 1.1em; margin: 1em 0; }
    .pass { color: #16a34a; } .fail { color: #dc2626; }
    .test-case { background: #fff; border: 1px solid #e5e5e5; border-radius: 6px; margin: 0.5em 0; padding: 0.6em 1em; }
    .test-case.passed { border-left: 4px solid #16a34a; }
    .test-case.failed { border-left: 4px solid #dc2626; }
    .test-case h3 { margin: 0 0 0.3em; font-size: 1em; }
    .error { background: #fef2f2; color: #dc2626; padding: 0.3em 0.5em; border-radius: 3px; font-family: monospace; font-size: 0.9em; white-space: pre-wrap; }
    #fixture { position: fixed; left: -9999px; top: 0; }
  </style>
</head>
<body>
  <h1>🧪 导向标识生成器 — 浏览器测试套件</h1>
  <div class="summary" id="summary"></div>
  <div id="results"></div>
  <div id="fixture"></div>

  <script src="js/core.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/state.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/exporters.js"></script>
  <script src="js/panel.js"></script>
  <script>
    var tests = [];
    function test(name, fn) { tests.push({ name: name, fn: fn }); }
    function assert(cond, msg) { if (!cond) throw new Error(msg || '断言失败'); }
    function assertEqual(a, e, msg) {
      if (JSON.stringify(a) !== JSON.stringify(e)) {
        throw new Error((msg || '值不相等') + '\n  期望: ' + JSON.stringify(e) + '\n  实际: ' + JSON.stringify(a));
      }
    }
    function svgOf(node) { return new XMLSerializer().serializeToString(node); }

    var fixture = document.getElementById('fixture');
    var measure = SignCore.createCanvasMeasurer();

    // ─── 元素 SVG 结构 ─────────────────────────────────

    test('Arrow 渲染：3 个 polygon（两头一柄）+ hitbox，八方向可用', function () {
      var el = SignState.createElement('arrow', { direction: 'left' });
      var r = SignRender.renderElement(el, 256, measure);
      assertEqual(r.node.querySelectorAll('polygon').length, 3, '两个箭头头 + 箭柄');
      assertEqual(r.node.querySelectorAll('rect').length, 1, 'hitbox');
      assert(r.width > 0, '宽度为正');
      ['left-up', 'right-up', 'right-down', 'left-down'].forEach(function (d) {
        var diag = SignState.createElement('arrow', { direction: d });
        var rd = SignRender.renderElement(diag, 256, measure);
        assertEqual(rd.node.querySelectorAll('polygon').length, 3, d + ' 渲染 3 个 polygon');
        assertEqual(rd.width, r.width, d + ' 宽度与轴 向一致');
      });
    });

    test('Arrow 四个方向几何不同且宽度一致', function () {
      var widths = {};
      ['up', 'down', 'left', 'right'].forEach(function (d) {
        var el = SignState.createElement('arrow', { direction: d });
        var r = SignRender.renderElement(el, 128, measure);
        widths[d] = Math.round(r.width * 100) / 100;
      });
      assertEqual(widths.up, widths.left, '上下与左右同宽');
      assertEqual(widths.right, widths.left, '镜像同宽');
      assertEqual(widths.down, widths.up, '上下同宽');
    });

    test('BilingualText 渲染：中英两个 text，加粗切换 font-weight', function () {
      var el = SignState.createElement('bilingual-text', { textZh: '世纪大道', textEn: 'Century Avenue' });
      var r = SignRender.renderElement(el, 200, measure);
      var texts = r.node.querySelectorAll('text');
      assertEqual(texts.length, 2);
      assertEqual(texts[0].textContent, '世纪大道');
      assertEqual(texts[1].textContent, 'Century Avenue');
      assertEqual(texts[0].getAttribute('font-weight'), '400');
      var bold = SignState.createElement('bilingual-text', { textZh: '站', textEn: 'St', bold: true });
      var r2 = SignRender.renderElement(bold, 200, measure);
      assertEqual(r2.node.querySelectorAll('text')[0].getAttribute('font-weight'), '700');
    });

    test('BilingualText 对齐：三种对齐文本都不越出内容盒', function () {
      ['left', 'center', 'right'].forEach(function (align) {
        var el = SignState.createElement('bilingual-text', {
          textZh: '世纪大道', textEn: 'Century Avenue', align: align,
        });
        var r = SignRender.renderElement(el, 200, measure);
        var mt = SignRender.elementMetrics(el, 200, measure);
        var texts = r.node.querySelectorAll('text');
        assertEqual(texts.length, 2);
        var contentRight = mt.pad.l + mt.textW;
        // 英文左右对齐有 s/30 光学缩进（sign_jr 同款）：左对齐右移、右对齐左移，
        // 允许英文在对应方向多出这一缩进；中文恒在内容盒内
        var indent = mt.pad.size / 30;
        for (var i = 0; i < texts.length; i++) {
          var isZh = texts[i].textContent === el.props.textZh;
          var w = isZh ? mt.zhW : mt.enW;
          var x = parseFloat(texts[i].getAttribute('x'));
          var allow = (align !== 'center' && !isZh) ? indent : 0;
          assert(x >= mt.pad.l - allow - 0.01, align + ' 文本左缘越界 x=' + x);
          assert(x + w <= contentRight + allow + 0.01, align + ' 文本右缘越界 ' + (x + w) + ' > ' + contentRight);
        }
      });
    });

    test('NumberLine 渲染：色条 rect + 数字 text + 号线/Line 标签', function () {
      var el = SignState.createElement('number-line', {
        lines: [{ number: '3', color: '#FCD600' }, { number: '14', color: '#626020' }, { number: '22', color: '#871C2B' }],
      });
      var r = SignRender.renderElement(el, 256, measure);
      assertEqual(r.node.querySelectorAll('rect').length, 4, '三条色条 + hitbox');
      var texts = Array.prototype.slice.call(r.node.querySelectorAll('text'));
      assertEqual(texts.length, 7, '3 + 1 + 4 + 2 + 2 逐位 + 号线 + Line');
      // 两位数仍用常规 Frutiger（不再切窄体），间距按墨区排版
      var one = texts.filter(function (t) { return t.textContent === '1'; })[0];
      var four = texts.filter(function (t) { return t.textContent === '4'; })[0];
      assert(one && four, '两位数逐字绘制');
      assert(one.getAttribute('font-family').indexOf('Frutiger Condensed') === -1, '两位数用常规 Frutiger');
      var rowHeight = 256, s = rowHeight * 0.6, padL = rowHeight * 0.2;
      var fontSize = s * 1.3;
      var ctx = document.createElement('canvas').getContext('2d');
      ctx.font = '400 ' + fontSize + 'px ' + SignCore.FONT_NUM;
      function inkLeftOf(node) {
        var tm = ctx.measureText(node.textContent);
        return parseFloat(node.getAttribute('x')) - tm.width / 2 - tm.actualBoundingBoxLeft;
      }
      // 每条线路自己的色条右缘（'3'→第0条，'14'→第1条，'22'→第2条）
      var stripeRights = Array.prototype.slice.call(r.node.querySelectorAll('rect')).slice(0, 3)
        .map(function (r2) { return parseFloat(r2.getAttribute('x')) + parseFloat(r2.getAttribute('width')); });
      var entryOf = { '3': 0, '1': 1, '4': 1, '2': 2 };
      // 回归：首位数字墨区不得嵌入左侧色条
      ['1', '2'].forEach(function (ch) {
        var node = texts.filter(function (t) { return t.textContent === ch; })[0];
        assert(inkLeftOf(node) >= stripeRights[entryOf[ch]] - 1,
          ch + ' 墨区左缘 ' + inkLeftOf(node) + ' 应 ≥ ' + stripeRights[entryOf[ch]]);
      });
      // 墨区间距设计：首位「1」的墨区间距与单位数「3」一致（不再因墨窄而显得更远）
      var three = texts.filter(function (t) { return t.textContent === '3'; })[0];
      var gap1 = inkLeftOf(one) - stripeRights[1];
      var gap3 = inkLeftOf(three) - stripeRights[0];
      assert(Math.abs(gap1 - gap3) < 1.5, '"1"首位墨区间距应与"3"一致 ' + gap1 + ' vs ' + gap3);
      // 相邻数字墨区间距统一（1→4 与 2→2 相同）
      function inkW(ch) {
        var tm = ctx.measureText(ch);
        return tm.actualBoundingBoxRight + tm.actualBoundingBoxLeft;
      }
      var two2 = texts.filter(function (t) { return t.textContent === '2'; });
      var gap14 = inkLeftOf(four) - (inkLeftOf(one) + inkW('1'));
      var gap22 = inkLeftOf(two2[1]) - (inkLeftOf(two2[0]) + inkW('2'));
      assert(Math.abs(gap14 - gap22) < 1.5, '数字墨区间距应统一 ' + gap14 + ' vs ' + gap22);
      // 数字与「号线」墨区顶对齐（墨区顶 = 基线 y 属性 − 实测墨区上升高；
      // 注意 SVG getBBox 对 text 返回行盒而非墨区，不能用于此项断言）
      var zhSize = s * 0.75 * SignRender.ZH_FONT_RATIO;
      var digitInkTop = parseFloat(four.getAttribute('y')) - measure.ascent('4', SignCore.FONT_NUM, 400, fontSize);
      var hao = texts.filter(function (t) { return t.textContent === '号线'; })[0];
      var zhInkTop = parseFloat(hao.getAttribute('y')) - measure.ascent('号线', SignCore.FONT_ZH, 400, zhSize);
      assert(Math.abs(digitInkTop - zhInkTop) < 1.5, '数字与号线墨区顶对齐 ' + digitInkTop + ' vs ' + zhInkTop);
    });

    test('TextLine 渲染：贯穿色条 + 大字 + 线/英文名标签', function () {
      var el = SignState.createElement('text-line', { text: '环', textEn: 'Loop Line', blockColor: '#461D84' });
      var r = SignRender.renderElement(el, 256, measure);
      var mt = SignRender.elementMetrics(el, 256, measure);
      var rects = r.node.querySelectorAll('rect');
      assertEqual(rects.length, 2, '色条 + hitbox');
      var stripe = rects[0];
      assertEqual(stripe.getAttribute('fill'), '#461D84');
      assertEqual(parseFloat(stripe.getAttribute('height')), mt.stripeH, '色条贯穿到行底');
      var texts = r.node.querySelectorAll('text');
      assertEqual(texts.length, 3, '大字 + 线 + 英文名');
      assertEqual(texts[0].textContent, '环');
      assert(texts[0].getAttribute('font-family').indexOf('Source Han Sans') !== -1, '思源黑体大字');
      assertEqual(texts[0].getAttribute('fill'), '#000000', '大字用文字颜色（同数字线路）');
      assertEqual(texts[1].textContent, '线');
      assertEqual(texts[2].textContent, 'Loop Line');
      assertEqual(r.width, mt.width);
      // 布局盒级间距：环两侧各一个 gap（getBBox x/width 为 advance 盒）
      fixture.appendChild(r.node);
      var big = texts[0].getBBox();
      var zh = texts[1].getBBox();
      var box = stripe.getBBox();
      var gapL = big.x - (box.x + box.width);
      var gapR = zh.x - (big.x + big.width);
      assert(Math.abs(gapL - gapR) < 2, '环两侧间距相等 ' + gapL + ' vs ' + gapR);
      // 墨区顶对齐（y 属性 − 实测墨区上升高）
      var s = 256 * 0.6;
      var zhSize = s * 0.75 * SignRender.ZH_FONT_RATIO;
      var bigInkTop = parseFloat(texts[0].getAttribute('y')) - measure.ascent('环', SignCore.FONT_ZH, 400, s);
      var zhInkTop = parseFloat(texts[1].getAttribute('y')) - measure.ascent('线', SignCore.FONT_ZH, 400, zhSize);
      assert(Math.abs(bigInkTop - zhInkTop) < 1.5, '环与线墨区顶对齐 ' + bigInkTop + ' vs ' + zhInkTop);
      fixture.removeChild(r.node);
    });

    test('TextLine 平铺渲染（关闭下沉）：「线」同级字号完整线路名 + 英文在下，无「线」后缀', function () {
      var el = SignState.createElement('text-line', {
        text: '机场联络线', textEn: 'Airport Link Line', nameSink: false, blockColor: '#C5003E',
      });
      var r = SignRender.renderElement(el, 256, measure);
      var mt = SignRender.elementMetrics(el, 256, measure);
      var rects = r.node.querySelectorAll('rect');
      assertEqual(rects.length, 2, '色条 + hitbox');
      assertEqual(rects[0].getAttribute('fill'), '#C5003E', '色条颜色');
      var texts = r.node.querySelectorAll('text');
      assertEqual(texts.length, 2, '线路名 + 英文名，无「线」后缀');
      assertEqual(texts[0].textContent, '机场联络线');
      assertEqual(texts[1].textContent, 'Airport Link Line');
      var s = 256 * 0.6;
      var labelBox = s * 0.75; // 「线 / 英文名」标签的内容盒高
      assert(Math.abs(mt.label.zhSize - labelBox * SignRender.ZH_FONT_RATIO) < 1e-9, 'metrics 中文字号 = 「线」标签字号');
      assert(Math.abs(mt.label.enSize - labelBox * SignRender.EN_FONT_RATIO) < 1e-9, 'metrics 英文字号 = 标签英文字号');
      assertEqual(parseFloat(texts[0].getAttribute('font-size')), mt.label.zhSize, '渲染字号 = metrics 中文字号');
      assertEqual(parseFloat(texts[1].getAttribute('font-size')), mt.label.enSize, '渲染字号 = metrics 英文字号');
      assert(parseFloat(texts[1].getAttribute('y')) > parseFloat(texts[0].getAttribute('y')), '英文在线路名下方');
      assertEqual(parseFloat(texts[0].getAttribute('x')), mt.labelX, '中文左缘 = 色条 + gap');
      assertEqual(parseFloat(texts[1].getAttribute('x')), mt.labelX, '英文左对齐中文');
      assertEqual(r.width, mt.width);
    });

    test('内容右对齐渲染：色块换边、编号换侧、标签盒内右对齐', function () {
      // 数字线路右对齐（输入两条线路，仅渲染第 1 条）
      var nl = SignState.createElement('number-line', {
        lines: [{ number: '4', color: '#E3002B' }, { number: '9', color: '#FCD600' }],
        align: 'right',
      });
      var r1 = SignRender.renderElement(nl, 256, measure);
      var mt1 = SignRender.elementMetrics(nl, 256, measure);
      var rects1 = r1.node.querySelectorAll('rect');
      assertEqual(rects1.length, 2, '1 色条 + hitbox（右对齐仅渲染第 1 条线路）');
      var texts1 = r1.node.querySelectorAll('text');
      assertEqual(texts1.length, 3, '单个数字 + 号线 + Line');
      assert(parseFloat(rects1[0].getAttribute('x')) > parseFloat(texts1[0].getAttribute('x')),
        '色条在编号右侧');
      assertEqual(parseFloat(rects1[0].getAttribute('x')), mt1.entries[0].stripeX, '色条 x = metrics');
      // 标签盒内右对齐：号线 右缘 = 标签盒右缘（朝向色块）
      var zhW = measure('号线', SignCore.FONT_ZH, 400, mt1.label.zhSize);
      assertEqual(parseFloat(texts1[1].getAttribute('x')), mt1.labelX + mt1.label.width - zhW, '号线右对齐');

      // 文字线路右对齐
      var tl = SignState.createElement('text-line', { text: '环', textEn: 'Loop Line', align: 'right' });
      var r2 = SignRender.renderElement(tl, 256, measure);
      var mt2 = SignRender.elementMetrics(tl, 256, measure);
      var stripe2 = r2.node.querySelectorAll('rect')[0];
      var big2 = r2.node.querySelectorAll('text')[0];
      assert(parseFloat(stripe2.getAttribute('x')) > parseFloat(big2.getAttribute('x')), '色条在大字右侧');
      assertEqual(parseFloat(stripe2.getAttribute('x')), mt2.stripeX, '色条 x = metrics');
      var xian = r2.node.querySelectorAll('text')[1];
      var zhW2 = measure('线', SignCore.FONT_ZH, 400, mt2.label.zhSize);
      assertEqual(parseFloat(xian.getAttribute('x')), mt2.labelX + mt2.label.width - zhW2, '线右对齐');
      assertEqual(r2.width, mt2.width);

      // 出口右对齐：编号移到「出口」右侧，基线不变
      var exL = SignState.createElement('exit', { code: '1' });
      var exR = SignState.createElement('exit', { code: '1', align: 'right' });
      var r3 = SignRender.renderElement(exR, 256, measure);
      var texts3 = r3.node.querySelectorAll('text');
      assertEqual(texts3[0].textContent, '1');
      assertEqual(texts3[1].textContent, '出口');
      assert(parseFloat(texts3[0].getAttribute('x')) > parseFloat(texts3[1].getAttribute('x')),
        '编号在「出口」右侧');
      var mtL = SignRender.elementMetrics(exL, 256, measure);
      var mtR = SignRender.elementMetrics(exR, 256, measure);
      assertEqual(mtR.codeBase, mtL.codeBase, '编号基线不变');
      assert(Math.abs(mtR.width - mtL.width) < 1e-9, '镜像后总宽不变');
      // 出口标签盒内右对齐：中英文右缘 = 标签盒右缘（朝向编号一侧）
      var zhWEx = measure('出口', SignCore.FONT_ZH, 400, mtR.label.zhSize);
      var enWEx = measure('Exit', SignCore.FONT_EN, 400, mtR.label.enSize);
      assertEqual(parseFloat(texts3[1].getAttribute('x')), mtR.labelX + mtR.label.width - zhWEx, '出口右对齐');
      assertEqual(parseFloat(texts3[2].getAttribute('x')), mtR.labelX + mtR.label.width - enWEx, 'Exit 右对齐');
    });

    test('标识牌灰框：每行 4 矩形、贴边界向内、先于元素渲染、关闭不渲染', function () {
      var svg = document.createElementNS(SignCore.SVG_NS, 'svg');
      var sign = SignState.createSign();
      sign.width = 1000;
      sign.rowHeight = 100;
      sign = SignState.addRow(sign);
      sign = SignState.addElement(sign, sign.rows[0].id,
        SignState.createElement('space', { widthRatio: 0.5 }));
      sign.frameWidth = 12;
      SignRender.renderSignInto(svg, sign, measure);
      var frames = svg.querySelectorAll('.sign-frame');
      assertEqual(frames.length, 8, '两行 × 4 条矩形');
      function byY(v) {
        return Array.prototype.filter.call(frames, function (r) {
          return parseFloat(r.getAttribute('y')) === v;
        });
      }
      // 第一行（y 0..100）：左条、上条、右条贴宽缘、下条距行底 12
      assertEqual(byY(0)[0].getAttribute('fill'), '#808080', '灰框颜色');
      var right0 = byY(0).filter(function (r) { return parseFloat(r.getAttribute('x')) === 988; });
      assertEqual(right0.length, 1, '右条贴宽缘');
      assertEqual(parseFloat(right0[0].getAttribute('width')), 12, '右条宽 = 灰框宽');
      assertEqual(parseFloat(right0[0].getAttribute('height')), 100, '右条高 = 行高');
      assertEqual(parseFloat(byY(88)[0].getAttribute('height')), 12, '第一行下条距行底 12');
      // 第二行（y 100..200）：拥有自己的上条与下条
      var top1 = byY(100).filter(function (r) { return parseFloat(r.getAttribute('width')) === 1000; });
      assertEqual(top1.length, 1, '第二行有自己的上条');
      var bottom1 = byY(188).filter(function (r) { return parseFloat(r.getAttribute('width')) === 1000; });
      assertEqual(bottom1.length, 1, '第二行有自己的下条');
      // 灰框后于元素渲染（框在内容之上，模拟真实边框遮挡）
      var rowG = svg.querySelectorAll('g.sign-row')[0];
      assertEqual(rowG.lastChild.getAttribute('class'), 'sign-frame', '灰框在元素之上');
      assert(!!rowG.querySelector('g.element'), '行内存在元素节点');
      assertEqual(frames[0].getAttribute('pointer-events'), 'none', '灰框不拦截点击');
      // 关闭：frameWidth 0 → 不渲染
      sign.frameWidth = 0;
      SignRender.renderSignInto(svg, sign, measure);
      assertEqual(svg.querySelectorAll('.sign-frame').length, 0, '关闭后不渲染');
    });

    test('Entrance/Exit 渲染：编号 + 双语标签；Exit 有出口黄背景', function () {
      var en = SignState.createElement('entrance', { code: 'C' });
      var r1 = SignRender.renderElement(en, 256, measure);
      var texts1 = r1.node.querySelectorAll('text');
      assertEqual(texts1[0].textContent, 'C');
      assertEqual(texts1[1].textContent, '出入口');

      var ex = SignState.createElement('exit', { code: '1' });
      var r2 = SignRender.renderElement(ex, 256, measure);
      var bg = r2.node.querySelector('rect');
      assertEqual(bg.getAttribute('fill'), '#F7D917', '出口黄背景');
      var texts2 = r2.node.querySelectorAll('text');
      assertEqual(texts2[1].textContent, '出口');
      assertEqual(texts2[2].textContent, 'Exit');
    });

    test('Space：无可见内容但占宽', function () {
      var el = SignState.createElement('space', { widthRatio: 0.5 });
      var r = SignRender.renderElement(el, 200, measure);
      assertEqual(r.width, 100);
      assertEqual(r.node.querySelectorAll('polygon,text').length, 0);
    });

    test('Icon 渲染：嵌套 svg、颜色替换、未知 id 回退', function () {
      assert(SignIcons && SignIcons.ALL, '图标库已加载');
      var el = SignState.createElement('icon', { icon: 'stairs', color: '#FF0000' });
      var r = SignRender.renderElement(el, 256, measure);
      var nested = r.node.querySelectorAll('svg');
      assertEqual(nested.length, 1, '嵌套 svg');
      assert(nested[0].querySelectorAll('path,rect,circle').length > 0, '图标有图形');
      assert(nested[0].querySelector('[fill="#FF0000"]'), 'fill="black" 已替换为元素颜色');
      assert(!nested[0].querySelector('[fill="black"]'), '无残留黑色填充');
      assertEqual(r.width, 256, '图标宽度 = 内容尺寸 + 左右内边距');
      var unknown = SignState.createElement('icon', { icon: 'nonexistent' });
      var r2 = SignRender.renderElement(unknown, 256, measure);
      assertEqual(r2.node.querySelectorAll('svg').length, 1, '未知图标回退默认图标');
    });

    // ─── 整牌渲染 ─────────────────────────────────────

    test('renderSignInto：viewBox、行数、选中态、data 属性', function () {
      var svg = document.createElementNS(SignCore.SVG_NS, 'svg');
      var state = SignState.createSign();
      var a = SignState.createElement('arrow');
      var b = SignState.createElement('space');
      state = SignState.addElement(state, state.rows[0].id, a);
      state = SignState.addElement(state, state.rows[0].id, b);
      state = SignState.addRow(state);
      state = SignState.addElement(state, state.rows[1].id, SignState.createElement('exit'));

      var layout = SignRender.renderSignInto(svg, state, measure, { selectedElementId: a.id });
      fixture.appendChild(svg);

      assertEqual(svg.getAttribute('viewBox'), '0 0 2048 512');
      assertEqual(svg.querySelectorAll('g.sign-row').length, 2);
      var sel = svg.querySelector('g.element.selected');
      assert(sel && sel.getAttribute('data-element-id') === a.id, '选中元素带 selected 类');
      assert(svg.querySelector('g.element[data-element-id="' + b.id + '"]'), '元素带 data-id');
      assertEqual(svg.querySelectorAll('.hitbox').length, 3, '每个元素一个 hitbox');
      assertEqual(layout.height, 512);
      assertEqual(layout.rows[0].elements.length, 2);
      assert(layout.rows[0].elements[1].x > 0, '第二个元素有偏移');
      fixture.removeChild(svg);
    });

    test('clean 模式：无 data 属性与 hitbox（导出安全）', function () {
      var svg = document.createElementNS(SignCore.SVG_NS, 'svg');
      var state = SignState.createSign();
      state = SignState.addElement(state, state.rows[0].id, SignState.createElement('arrow'));
      SignRender.renderSignInto(svg, state, measure, { clean: true });
      assertEqual(svg.querySelectorAll('.hitbox').length, 0);
      assertEqual(svg.querySelectorAll('[data-element-id]').length, 0);
    });

    test('元素背景色 rect 覆盖整个元素盒（含 padding）', function () {
      var el = SignState.createElement('big-number', {
        text: '4', color: '#000000', backgroundColor: '#FFFFFF',
      });
      var r = SignRender.renderElement(el, 256, measure);
      var bg = r.node.querySelector('rect');
      assertEqual(bg.getAttribute('width'), String(r.width));
      assertEqual(bg.getAttribute('height'), '256');
    });

    // ─── 序列化 & 导出 ────────────────────────────────

    test('导出 SVG 字符串：XML 声明 + 内嵌字体 + 可被 DOMParser 解析', function () {
      var state = SignState.createSign();
      state = SignState.addElement(state, state.rows[0].id,
        SignState.createElement('bilingual-text', { textZh: '人民广场', textEn: "People's Square" }));
      var fakeEmbed = { 'SourceHanSansSC-Regular.woff2': 'data:font/woff2;base64,AAAA' };
      var str = SignExporters.buildExportSVGString(state, measure, fakeEmbed);
      assert(str.indexOf('<?xml') === 0, '有 XML 声明');
      assert(str.indexOf('@font-face') !== -1, '内嵌 @font-face');
      var doc = new DOMParser().parseFromString(str, 'image/svg+xml');
      assert(!doc.querySelector('parsererror'), 'SVG 合法');
      assert(doc.querySelector('text'), '包含文本元素');
    });

    test('导出 SVG 引用面按需内嵌：纯数字牌不含中文字体', function () {
      var state = SignState.createSign();
      state = SignState.addElement(state, state.rows[0].id, SignState.createElement('big-number', { text: '4' }));
      var files = SignExporters.collectUsedFonts(state);
      assert(files.num400, '用到 Frutiger');
      assert(!files.zh400, '未用中文');
    });

    // ─── 预设 ─────────────────────────────────────────

    test('预设：保存/列表/物化（新 id）/删除', function () {
      localStorage.removeItem(SignPresets.KEY);
      var els = [
        SignState.createElement('arrow'),
        SignState.createElement('bilingual-text', { textZh: '测试', textEn: 'Test' }),
      ];
      SignPresets.save('测试预设', els);
      var items = SignPresets.list();
      assertEqual(items.length, 1);
      assertEqual(items[0].name, '测试预设');
      assertEqual(items[0].elements.length, 2);

      var materialized = SignPresets.materialize(items[0].id);
      assertEqual(materialized.length, 2);
      assert(materialized[0].id !== els[0].id, '物化后 id 全新');
      assertEqual(materialized[1].props.textZh, '测试', 'props 深拷贝保留');

      SignPresets.remove(items[0].id);
      assertEqual(SignPresets.list().length, 0);
      localStorage.removeItem(SignPresets.KEY);
    });

    // ─── 颜色选择器组件 ────────────────────────────────

    test('颜色选择器：点色板回调、hex 输入校验、透明切换', function () {
      var got = { v: 'initial' };
      var picker = SignPanel.buildColorPicker({
        value: '#000000', nullable: true, onChange: function (v) { got.v = v; },
      });
      fixture.appendChild(picker);
      var swatch = picker.querySelector('.cp-swatch[data-color="#E3002B"]');
      swatch.click();
      assertEqual(got.v, '#E3002B', '点击色板');

      var hex = picker.querySelector('.hex-input');
      hex.value = '#0f0';
      hex.dispatchEvent(new Event('input'));
      assertEqual(got.v, '#00FF00', '三位 hex 规范化');

      hex.value = 'oops';
      hex.dispatchEvent(new Event('input'));
      assertEqual(got.v, '#00FF00', '非法输入不回调');
      assert(hex.classList.contains('invalid'), '非法输入标红');

      picker.querySelector('.cp-null-btn').click();
      assertEqual(got.v, null, '透明切换');
      fixture.removeChild(picker);
    });

    test('颜色选择器：城市下拉按城市重建色板（潘通2935C蓝合并）', function () {
      var got = { v: null };
      var picker = SignPanel.buildColorPicker({
        value: '#000000', onChange: function (v) { got.v = v; },
      });
      fixture.appendChild(picker);
      function setCity(v) {
        var sel = picker.querySelector('.cp-city-select');
        sel.value = v;
        sel.dispatchEvent(new Event('change'));
      }
      function swatchCount() { return picker.querySelectorAll('.cp-swatch').length; }
      // 复位到上海：同源 localStorage 的偏好残留不得影响断言
      setCity('shanghai');
      assertEqual(swatchCount(), 34, '上海 = 23 线路 + 7 附加 + 4 通用');
      assertEqual(picker.querySelector('.cp-city-select').value, 'shanghai', '下拉回显当前城市');
      assertEqual(picker.querySelectorAll('.cp-city-select option').length, 3, '下拉列出全部城市');

      setCity('chongqing');
      assertEqual(swatchCount(), 29, '重庆 = 24 线路去重 + 环线 + 4 通用');
      var panto = picker.querySelector('.cp-swatch[data-color="#0057B7"]');
      assertEqual(panto.title, '潘通2935C蓝', '共用色合并命名');
      assertEqual(picker.querySelectorAll('.cp-swatch[data-color="#0057B7"]').length, 1, '共用色只出现一次');
      panto.click();
      assertEqual(got.v, '#0057B7', '点击合并色块提交颜色');
      assert(panto.classList.contains('active'), '合并色块点亮选中态');

      setCity('chengdu');
      assertEqual(swatchCount(), 53, '成都 = 30 线路 + 19 附加 + 4 通用');
      assertEqual(picker.querySelector('.cp-swatch[data-color="#7F9F3A"]').title, '蓉2号线');

      setCity('shanghai'); // 恢复默认偏好（localStorage 与编辑器同源共享）
      assertEqual(swatchCount(), 34, '切回上海');
      fixture.removeChild(picker);
    });

    // ─── PNG 导出（异步）───────────────────────────────

    test('导出 PNG：生成正确尺寸的 PNG Blob', function () {
      var state = SignState.createSign();
      state = SignState.addElement(state, state.rows[0].id,
        SignState.createElement('arrow', { direction: 'right' }));
      // 直接用假字体数据走内部管线（绕过 fonts-data.js 懒加载）
      var str = SignExporters.buildExportSVGString(state, measure, {});
      var url = URL.createObjectURL(new Blob([str], { type: 'image/svg+xml' }));
      return new Promise(function (resolve, reject) {
        var img = new Image();
        img.onload = function () {
          var canvas = document.createElement('canvas');
          canvas.width = 2048; canvas.height = 256;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, 2048, 256);
          canvas.toBlob(function (blob) {
            if (!blob) { reject(new Error('PNG blob 为空')); return; }
            assert(blob.size > 1000, 'PNG 有实际内容');
            assertEqual(blob.type, 'image/png');
            resolve();
          }, 'image/png');
        };
        img.onerror = function () { reject(new Error('SVG 光栅化失败')); };
        img.src = url;
      });
    });

    // ─── 运行器 ────────────────────────────────────────

    function run() {
      var results = document.getElementById('results');
      var passed = 0, failed = 0;
      var chain = Promise.resolve();
      tests.forEach(function (t) {
        var item = document.createElement('div');
        item.className = 'test-case';
        item.innerHTML = '<h3></h3>';
        item.querySelector('h3').textContent = t.name;
        var ran = false;
        chain = chain.then(function () {
          return Promise.resolve().then(t.fn).then(function () {
            ran = true; passed++;
            item.classList.add('passed');
            item.querySelector('h3').innerHTML = '✔ ' + item.querySelector('h3').textContent;
          }, function (err) {
            ran = true; failed++;
            item.classList.add('failed');
            var pre = document.createElement('div');
            pre.className = 'error';
            pre.textContent = (err && err.message) || String(err);
            item.appendChild(pre);
          });
        });
        results.appendChild(item);
      });
      chain.then(function () {
        var s = document.getElementById('summary');
        s.innerHTML = '结果：<b class="' + (failed ? 'fail' : 'pass') + '">' +
          passed + ' 通过 / ' + failed + ' 失败</b>';
        document.title = failed ? '✖ 测试失败' : '✔ 全部通过';
      });
    }
    run();
  </script>
